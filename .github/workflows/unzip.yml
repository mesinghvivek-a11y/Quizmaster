# Save as: .github/workflows/unzip-and-commit.yml
# Usage: upload/commit mypyq-online-site.zip to the repo root on `main`.
# The workflow unzips it into ./public and commits the extracted files.
name: Unzip site and commit

on:
  push:
    branches: [main]
    paths: ['mypyq-online-site.zip']   # runs only when the zip changes
  workflow_dispatch:                   # also lets you run it manually

permissions:
  contents: write                      # needed to push the commit

concurrency:
  group: unzip-site
  cancel-in-progress: false

env:
  ZIP_FILE: mypyq-online-site.zip
  TARGET_DIR: public                   # set Cloudflare/Netlify publish directory to this
  FAIL_ON_PLACEHOLDERS: "false"        # set to "true" to block publishing while [yellow placeholders] remain

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unzip into target folder
        run: |
          set -euo pipefail
          test -f "$ZIP_FILE" || { echo "::error::$ZIP_FILE not found in repo root"; exit 1; }
          rm -rf /tmp/unz && mkdir -p /tmp/unz
          unzip -q "$ZIP_FILE" -d /tmp/unz
          # the zip has one top-level folder (mypyq-online-site/); use it when present
          SRC=/tmp/unz
          if [ "$(find /tmp/unz -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && [ -d "$(find /tmp/unz -mindepth 1 -maxdepth 1)" ]; then
            SRC="$(find /tmp/unz -mindepth 1 -maxdepth 1)"
          fi
          mkdir -p "$TARGET_DIR"
          rsync -a --delete "$SRC"/ "$TARGET_DIR"/      # clean replace, keeps dotfiles like .well-known
          touch "$TARGET_DIR/.nojekyll"                 # harmless; needed if you use GitHub Pages
          echo "Extracted $(find "$TARGET_DIR" -type f | wc -l) files into $TARGET_DIR"

      - name: Check legal-page placeholders
        run: |
          if grep -rq 'class="fill"' "$TARGET_DIR" --include=index.html; then
            echo "::warning::Privacy/Terms still contain highlighted placeholders (operator name / grievance officer)."
            [ "$FAIL_ON_PLACEHOLDERS" = "true" ] && exit 1
          fi
          exit 0

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$TARGET_DIR"
          if git diff --cached --quiet; then
            echo "No changes to commit"; exit 0
          fi
          git commit -m "Deploy site from ${ZIP_FILE} (${GITHUB_SHA::7})"
          git push
