name: Unzip and commit site

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: Path of the zip in the repo
        default: quizmaster-site.zip

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip into repo root
        env:
          ZIP: ${{ inputs.zip_path }}
        run: |
          test -f "$ZIP" || { echo "Zip not found: $ZIP"; exit 1; }
          unzip -oq "$ZIP" -d .
          rm "$ZIP"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Quiz Master site" || echo "Nothing to commit"
          git push
